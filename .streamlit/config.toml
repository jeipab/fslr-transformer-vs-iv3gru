# ===== LOCAL/NETWORK CONFIGURATION =====
# Optimized for running on your local machine or home network
# Simpler than the Vast.AI/Cloudflare setup

[server]
# File upload limits
maxUploadSize = 500  # MB
maxMessageSize = 700  # MB (supports Base64 encoding)

# Network settings for local network access
enableCORS = false  # Not needed for local network
enableWebsocketCompression = true  # Still good for performance
headless = true  # Run without browser auto-open

# Server binding (for network access from other devices)
port = 8501  # Standard Streamlit port (or keep 8081)
address = "0.0.0.0"  # Allows access from other devices on your network

# Security (better for local network)
enableXsrfProtection = true  # Enable for local security

# File watching
fileWatcherType = "auto"
runOnSave = true  # Auto-reload on code changes (useful for development)


# ===== BROWSER CONFIGURATION =====
[browser]
gatherUsageStats = false
serverPort = 8501  # Match server port


# ===== THEME CONFIGURATION =====
[theme]
base = "dark"
primaryColor = "#FF4B4B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"


# ===== RUNNER CONFIGURATION (Optional but recommended) =====
[runner]
magicEnabled = false
fastReruns = true
fixMatplotlib = true


# ===== CLIENT CONFIGURATION (Optional) =====
[client]
showErrorDetails = true  # Show errors for debugging (local dev)
showToolbarMode = "auto"


# ===== NOTES =====
# This config is simpler than the Vast.AI version:
# - No extended timeouts (not needed on local network)
# - XSRF protection enabled (better security)
# - CORS disabled (not needed locally)
# - runOnSave enabled (useful for development)
# - showErrorDetails enabled (helps with debugging)
#
# Access your app:
# - Local: http://localhost:8501
# - Network: http://YOUR_IP:8501 (use show_network_info.py to find IP)

